name: Tomodachi fenced local validator failover

on:
  push:
    branches:
      - tomodachi/fenced-local-validator-failover
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUST_LOG: error

jobs:
  same-epoch-handoff:
    name: Four-validator A-B-A handoff
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
      - uses: taiki-e/install-action@protoc
      - name: Prove fenced local-key failover
        run: cargo test -p sui-swarm --test local_validator_failover
